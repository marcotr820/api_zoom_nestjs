version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: justicia_pg_local
    restart: always
    environment:
      POSTGRES_USER: HolaMundo
      POSTGRES_PASSWORD: Admin123*
      POSTGRES_DB: justicia_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Carpeta local donde pondrás tu dump

volumes:
  postgres_data:
